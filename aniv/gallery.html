<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories of You 💖</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    .gallery-ldr {
      padding: 120px 25px 80px;
      text-align: center;
      color: #fff;
      background: linear-gradient(180deg, rgba(20, 0, 40, 0.4), rgba(40, 0, 70, 0.6));
      animation: fadeIn 2s ease;
    }

    .gallery-ldr h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8em;
      margin-bottom: 15px;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 160, 255, 0.6);
    }

    .subtitle {
      font-size: 1em;
      opacity: 0.85;
      margin-bottom: 40px;
      font-weight: 300;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
      justify-items: center;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      transition: all 0.4s ease;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 18px;
      transition: all 0.6s ease;
      filter: brightness(0.95);
      object-fit: cover;
    }

    .photo-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }

    .photo-card:hover img {
      filter: brightness(1.1);
    }

    .photo-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: radial-gradient(circle, rgba(255, 200, 255, 0.15) 0%, transparent 70%);
      opacity: 0;
      transition: 0.4s;
    }

    .photo-card:hover::after {
      opacity: 1;
    }

    .btn {
      display: inline-block;
      margin-top: 50px;
      background: linear-gradient(135deg, #9f73ff, #ff8fcf);
      color: #fff;
      padding: 14px 30px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .gallery-ldr h2 {
        font-size: 2.2em;
      }
      .btn {
        padding: 12px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="twinkling"></div>
  <div class="clouds"></div>

  <header>
    <nav>
      <h1 class="logo">💫 Our Journey</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html" class="active">Moments</a></li>
        <li><a href="message.html">Message</a></li>
      </ul>
    </nav>
  </header>

  <section class="gallery-ldr">
    <h2>Every Photo Holds a Piece of My Heart 💕</h2>

    <div class="photo-grid">
      <div class="photo-card">
        <img src="img/sasa1.jpeg" alt="Her Smile 1">
      </div>
      <div class="photo-card">
        <img src="img/sasa2.jpeg" alt="Her Smile 2">
      </div>
      <div class="photo-card">
        <img src="img/sasa3.jpeg" alt="Her Smile 3">
      </div>
      <div class="photo-card">
        <img src="img/sasa4.jpeg" alt="Her Smile 4">
      </div>
    </div>

    <a href="message.html" class="btn">To My Heart 💖</a>
  </section>

  <!-- Musik otomatis -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2024/12/17/audio_4c74b6a3e1.mp3" type="audio/mp3">
  </audio>
</body>
</html>
